
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vincular WhatsApp Bot</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode/1.5.3/qrcode.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #25D366, #128C7E);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        .logo {
            font-size: 48px;
            margin-bottom: 20px;
        }
        h1 {
            color: #25D366;
            margin-bottom: 10px;
        }
        .instructions {
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .qr-container {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 2px solid #e9ecef;
        }
        #qrcode {
            margin: 0 auto;
        }
        .steps {
            text-align: left;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }
        .step {
            margin-bottom: 10px;
            padding: 10px;
            background: white;
            border-radius: 8px;
            border-left: 4px solid #25D366;
        }
        .status {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: bold;
            color: white;
        }
        .status.waiting {
            background: #ffc107;
        }
        .status.connected {
            background: #28a745;
        }
        .refresh-btn {
            background: #25D366;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
            transition: background 0.3s;
        }
        .refresh-btn:hover {
            background: #20c55a;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">📱</div>
        <h1>Vincular WhatsApp Bot</h1>
        <p class="instructions">
            Escanea el código QR con tu WhatsApp para vincular el bot
        </p>
        
        <div class="qr-container">
            <div id="qrcode"></div>
        </div>
        
        <div class="steps">
            <div class="step">
                <strong>1.</strong> Abre WhatsApp en tu teléfono
            </div>
            <div class="step">
                <strong>2.</strong> Ve a <strong>Configuración</strong> → <strong>Dispositivos vinculados</strong>
            </div>
            <div class="step">
                <strong>3.</strong> Toca <strong>"Vincular dispositivo"</strong>
            </div>
            <div class="step">
                <strong>4.</strong> Escanea este código QR
            </div>
        </div>
        
        <button class="refresh-btn" onclick="location.reload()">
            🔄 Actualizar código QR
        </button>
    </div>
    
    <div class="status waiting" id="status">
        ⏳ Esperando vinculación...
    </div>

    <script>
        // Generar QR Code
        QRCode.toCanvas(document.getElementById('qrcode'), '2@coE4pyFzByG/ulKOgKpvfGx2SlBQ36NXLNod62PNYq1fGybfp5WbTG71dSvA33i1RDpIPxAdEawWNJGuLdvqQjl6+EBa+ltnvlI=,Y3QXw9/Sjc3zcSTHVFF03PvsNDpSqL24oBOjcW0I02Q=,TujqOo6IFKIrVOXD/GXwRZBpvwwygpN83j//BicVciE=,jhcBxWh7xpmCsB+MZEXhwKNi++tY7VtzDbGlAD2sj+Q=,1', {
            width: 256,
            margin: 2,
            color: {
                dark: '#000000',
                light: '#FFFFFF'
            }
        });

        // Verificar estado cada 3 segundos
        setInterval(async () => {
            try {
                const response = await fetch('/status');
                const data = await response.json();
                const statusEl = document.getElementById('status');
                
                if (data.ready) {
                    statusEl.textContent = '✅ Bot vinculado correctamente';
                    statusEl.className = 'status connected';
                    setTimeout(() => {
                        window.close();
                    }, 3000);
                }
            } catch (error) {
                console.error('Error checking status:', error);
            }
        }, 3000);
    </script>
</body>
</html>
